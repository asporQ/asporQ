<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="stay curious, stay sparkly">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBAAC4"/>
      <stop offset="0.45" stop-color="#A79AD6"/>
      <stop offset="0.8" stop-color="#4F5CA8"/>
      <stop offset="1" stop-color="#1B2038"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,4 61,37 96,37 68,58 79,92 50,72 21,92 32,58 4,37 39,37"/>
    </symbol>
    <symbol id="sparkle" viewBox="0 0 100 100">
      <path d="M50 0 Q54 46 100 50 Q54 54 50 100 Q46 54 0 50 Q46 46 50 0Z"/>
    </symbol>
    <clipPath id="round"><rect width="1200" height="140" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="140" fill="url(#dusk)"/>

    <circle cx="140" cy="100" r="70" fill="url(#glow)"/>
    <circle cx="620" cy="30" r="80" fill="url(#glow)"/>
    <circle cx="1080" cy="90" r="70" fill="url(#glow)"/>
    <g fill="#FFFFFF" opacity="0.28">
      <circle cx="60" cy="30" r="5"/><circle cx="300" cy="115" r="6"/><circle cx="470" cy="25" r="4"/>
      <circle cx="760" cy="120" r="6"/><circle cx="900" cy="20" r="5"/><circle cx="1170" cy="30" r="5"/>
    </g>

    <use xlink:href="#star" x="50"   y="75" width="36" height="36" fill="#F6D26A" transform="rotate(-12 68 93)"/>
    <use xlink:href="#star" x="190"  y="20" width="28" height="28" fill="#7FC8C4" transform="rotate(14 204 34)"/>
    <use xlink:href="#star" x="380"  y="85" width="26" height="26" fill="#F4B6D2" transform="rotate(-8 393 98)"/>
    <use xlink:href="#star" x="520"  y="15" width="22" height="22" fill="#F6A98B" transform="rotate(18 531 26)"/>
    <use xlink:href="#star" x="690"  y="95" width="30" height="30" fill="#BFE8D4" transform="rotate(-15 705 110)"/>
    <use xlink:href="#star" x="830"  y="25" width="34" height="34" fill="#F6D26A" transform="rotate(10 847 42)"/>
    <use xlink:href="#star" x="960"  y="88" width="24" height="24" fill="#B8679E" transform="rotate(-20 972 100)"/>
    <use xlink:href="#star" x="1060" y="20" width="38" height="38" fill="#F4B6D2" transform="rotate(12 1079 39)"/>
    <use xlink:href="#star" x="1135" y="85" width="28" height="28" fill="#C8B6F2" transform="rotate(-10 1149 99)"/>
    <use xlink:href="#star" x="280"  y="45" width="16" height="16" fill="#F6D26A"/>

    <use xlink:href="#sparkle" x="110"  y="40" width="26" height="26" fill="#FFFFFF" opacity="0.9"/>
    <use xlink:href="#sparkle" x="440"  y="55" width="20" height="20" fill="#FFFFFF" opacity="0.85"/>
    <use xlink:href="#sparkle" x="760"  y="50" width="22" height="22" fill="#FFFFFF" opacity="0.85"/>
    <use xlink:href="#sparkle" x="1000" y="45" width="26" height="26" fill="#FFFFFF" opacity="0.95"/>

    <g text-anchor="middle">
      <text x="600" y="76" font-size="30" font-style="italic" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif">stay curious, stay sparkly</text>
      <text x="600" y="104" font-size="14" letter-spacing="4" fill="#FFFFFF" opacity="0.85" font-family="'Trebuchet MS', Verdana, sans-serif">thanks for stopping by</text>
    </g>
  </g>
</svg>
