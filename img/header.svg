<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="hi, i'm Por">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2038"/>
      <stop offset="0.45" stop-color="#4F5CA8"/>
      <stop offset="0.8" stop-color="#A79AD6"/>
      <stop offset="1" stop-color="#EBAAC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,4 61,37 96,37 68,58 79,92 50,72 21,92 32,58 4,37 39,37"/>
    </symbol>
    <symbol id="sparkle" viewBox="0 0 100 100">
      <path d="M50 0 Q54 46 100 50 Q54 54 50 100 Q46 54 0 50 Q46 46 50 0Z"/>
    </symbol>
    <clipPath id="round"><rect width="1200" height="240" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="240" fill="url(#sky)"/>

    <!-- bokeh glow, like the night-forest reference -->
    <circle cx="170" cy="60" r="70" fill="url(#glow)"/>
    <circle cx="520" cy="200" r="90" fill="url(#glow)"/>
    <circle cx="930" cy="50" r="80" fill="url(#glow)"/>
    <circle cx="1100" cy="190" r="60" fill="url(#glow)"/>
    <g fill="#FFFFFF" opacity="0.28">
      <circle cx="80" cy="170" r="5"/><circle cx="260" cy="205" r="7"/><circle cx="360" cy="30" r="4"/>
      <circle cx="720" cy="215" r="6"/><circle cx="800" cy="25" r="5"/><circle cx="1030" cy="110" r="4"/>
      <circle cx="1160" cy="60" r="6"/><circle cx="640" cy="20" r="4"/>
    </g>

    <!-- pastel confetti stars (from the glitter reference) -->
    <use xlink:href="#star" x="40"  y="30"  width="46" height="46" fill="#B8679E" transform="rotate(-14 63 53)"/>
    <use xlink:href="#star" x="150" y="150" width="34" height="34" fill="#7FC8C4" transform="rotate(12 167 167)"/>
    <use xlink:href="#star" x="250" y="40"  width="24" height="24" fill="#F6D26A" transform="rotate(20 262 52)"/>
    <use xlink:href="#star" x="330" y="170" width="28" height="28" fill="#F6A98B" transform="rotate(-10 344 184)"/>
    <use xlink:href="#star" x="430" y="25"  width="30" height="30" fill="#A99BE0" transform="rotate(8 445 40)"/>
    <use xlink:href="#star" x="560" y="185" width="22" height="22" fill="#F4B6D2" transform="rotate(-18 571 196)"/>
    <use xlink:href="#star" x="700" y="30"  width="32" height="32" fill="#BFE8D4" transform="rotate(15 716 46)"/>
    <use xlink:href="#star" x="790" y="170" width="40" height="40" fill="#F6D26A" transform="rotate(-8 810 190)"/>
    <use xlink:href="#star" x="900" y="95"  width="22" height="22" fill="#F6A98B" transform="rotate(25 911 106)"/>
    <use xlink:href="#star" x="990" y="30"  width="36" height="36" fill="#7FC8C4" transform="rotate(-12 1008 48)"/>
    <use xlink:href="#star" x="1075" y="150" width="44" height="44" fill="#F4B6D2" transform="rotate(10 1097 172)"/>
    <use xlink:href="#star" x="1130" y="30"  width="26" height="26" fill="#C8B6F2" transform="rotate(-20 1143 43)"/>
    <use xlink:href="#star" x="95"  y="110" width="18" height="18" fill="#F6D26A"/>
    <use xlink:href="#star" x="610" y="95"  width="16" height="16" fill="#F4B6D2"/>
    <use xlink:href="#star" x="1020" y="195" width="18" height="18" fill="#BFE8D4"/>

    <!-- white 4-point sparkles (from the fairy-frame reference) -->
    <use xlink:href="#sparkle" x="195" y="85"  width="34" height="34" fill="#FFFFFF" opacity="0.95"/>
    <use xlink:href="#sparkle" x="470" y="120" width="22" height="22" fill="#FFFFFF" opacity="0.85"/>
    <use xlink:href="#sparkle" x="850" y="60"  width="38" height="38" fill="#FFFFFF" opacity="0.95"/>
    <use xlink:href="#sparkle" x="1150" y="120" width="26" height="26" fill="#FFFFFF" opacity="0.9"/>
    <use xlink:href="#sparkle" x="70"  y="195" width="24" height="24" fill="#FFFFFF" opacity="0.8"/>
    <use xlink:href="#sparkle" x="660" y="165" width="18" height="18" fill="#FFFFFF" opacity="0.8"/>

    <!-- title -->
    <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
      <text x="600" y="122" font-size="62" font-style="italic" fill="#1B2038" opacity="0.35" filter="url(#soft)">hi, i'm Porpor Arkash</text>
      <text x="600" y="118" font-size="62" font-style="italic" fill="#FFFFFF">hi, Porpor Arkash</text>
      <text x="600" y="164" font-size="18" letter-spacing="3" fill="#FFFFFF" opacity="0.92" font-family="'Trebuchet MS', Verdana, sans-serif">frontend dev · tinkerer · collector of small stars</text>
    </g>
    <use xlink:href="#sparkle" x="813" y="72" width="20" height="20" fill="#FFFFFF"/>
  </g>
</svg>
